name: pe-lab

# Topology:
#
#   host0 <-> pe0 <-> pe1 <-> host1
#
#   hosts (group: host) run the agnhost image as plain Linux hosts
#   pe0/pe1 (group: frr) run FRR 10.7.1
#
# Each node mounts its own hosts/<name>/setup.sh to /setup.sh and runs it via
# exec (which fires *after* the container entrypoint has started).
topology:
  groups:
    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - hosts/__clabNodeName__/setup.sh:/setup.sh
        - groups/frr/daemons:/etc/frr/daemons
        - groups/frr/vtysh.conf:/etc/frr/vtysh.conf
        # Per-node frr.conf (each PE has its own ASN / BGP config).
        - hosts/__clabNodeName__/frr.conf:/etc/frr/frr.conf
      exec:
        - /setup.sh
    host:
      kind: linux
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      cmd: netexec --http-port=8889
      binds:
        - hosts/__clabNodeName__/setup.sh:/setup.sh
      exec:
        - /setup.sh

  nodes:
    host0:
      group: host
    pe0:
      group: frr
    pe1:
      group: frr
    host1:
      group: host

  links:
    - endpoints: ["host0:tope1", "pe0:tohost1"]
    - endpoints: ["host0:tope2", "pe0:tohost2"]
    - endpoints: ["host0:tope3", "pe0:tohost3"]
    - endpoints: ["host0:tope4", "pe0:tohost4"]
    - endpoints: ["pe0:tope", "pe1:tope"]
    - endpoints: ["pe1:tohost1", "host1:tope1"]
    - endpoints: ["pe1:tohost2", "host1:tope2"]
    - endpoints: ["pe1:tohost3", "host1:tope3"]
    - endpoints: ["pe1:tohost4", "host1:tope4"]
